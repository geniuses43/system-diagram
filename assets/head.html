<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=JetBrains+Mono:wght@400&display=swap">
<style>
/* Цвета — токены; тёмная тема по системе и по data-theme */
:root{
  --bg:#f6f7f9; --fg:#1c2230; --muted:#6b7385; --line:#3a4254;
  --box:#ffffff; --stroke:#c9ced8; --server:#eef1f6; --data:#e9f3ee;
  --accent:#c2410c; --accent-fill:#fff3ec; --plan:#8a93a6; --pulse:#2563eb; --pulse-acc:#f97316;
  --sans:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12151b; --fg:#e4e7ee; --muted:#9aa2b3; --line:#b8bfcd;
  --box:#1b2029; --stroke:#363d4b; --server:#171b23; --data:#16221c;
  --accent:#fb923c; --accent-fill:#2a1c12; --plan:#7d869a; --pulse:#93c5fd; --pulse-acc:#fed7aa; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12151b; --fg:#e4e7ee; --muted:#9aa2b3; --line:#b8bfcd;
  --box:#1b2029; --stroke:#363d4b; --server:#171b23; --data:#16221c;
  --accent:#fb923c; --accent-fill:#2a1c12; --plan:#7d869a; --pulse:#93c5fd; --pulse-acc:#fed7aa; color-scheme:dark}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);
  padding:20px max(16px,env(safe-area-inset-right,0px)) 32px max(16px,env(safe-area-inset-left,0px))}
h1{font-size:20px;font-weight:600;margin:0 0 12px;text-wrap:balance}
.legend{display:flex;flex-wrap:wrap;gap:8px 24px;font-size:13px;color:var(--muted);margin-bottom:14px}
.legend span{display:inline-flex;align-items:center;gap:8px}
.legend i{display:inline-block;width:34px;height:0;border-top:2px solid var(--line)}
.legend i.acc{border-color:var(--accent)} .legend i.dash{border-top-style:dashed;border-color:var(--plan)}
.legend i.flow{border-top:3px dotted var(--pulse)}
.legend b{display:inline-block;width:16px;height:12px;border:1px solid var(--stroke);border-radius:3px}
.legend b.data{background:var(--data)} .legend b.ext{background:var(--accent-fill);border-color:var(--accent)}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
figure{margin:0;min-width:{{MINW}}px}
figcaption{font-size:13px;color:var(--muted);margin-top:10px;max-width:70ch}
svg{width:100%;height:auto;display:block;color:var(--fg)}
svg text{font-family:var(--sans);fill:var(--fg)}
svg .t{font-size:12px} svg .b{font-size:12.5px;font-weight:600} svg .s{font-size:10.5px;fill:var(--muted)}
svg .e{font-size:10px;fill:var(--muted);paint-order:stroke;stroke:var(--bg);stroke-width:4px;stroke-linejoin:round}
svg .hdr{font-size:13px;font-weight:600}
svg .zone{font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;fill:var(--muted)}
svg .dh{font-family:var(--mono);font-size:11.5px}
svg rect{fill:var(--box);stroke:var(--stroke);stroke-width:1}
svg rect.z-server{fill:var(--server);stroke:var(--line);stroke-width:1.5}
svg rect.z-group{fill:none;stroke:var(--stroke);stroke-dasharray:2 3}
svg rect.z-data{fill:var(--data);stroke:var(--stroke)}
svg rect.k-ext{fill:var(--accent-fill);stroke:var(--accent)}
svg rect.k-data{fill:var(--data);stroke:var(--line)}
svg rect.k-plan{stroke:var(--plan);stroke-dasharray:5 4}
svg rect.k-role,svg rect.k-key{stroke:var(--line)}
svg .ln{fill:none;stroke:var(--line);stroke-width:1.3}
svg .ln.acc{stroke:var(--accent);stroke-width:1.6}
svg .ln.plan{stroke:var(--plan);stroke-dasharray:5 4}
svg .flow{fill:none;stroke:var(--pulse);stroke-width:2.6;stroke-linecap:round;stroke-dasharray:1 23;animation:flow 1.6s linear infinite}
svg .flow.acc{stroke:var(--pulse-acc)}
@keyframes flow{to{stroke-dashoffset:-24}}
@media (prefers-reduced-motion: reduce){svg .flow{animation:none}}
svg .mk-fg path{fill:var(--line)} svg .mk-acc path{fill:var(--accent)} svg .mk-plan path{fill:var(--plan)}
</style>
</head>
<body>
<h1>{{TITLE}}</h1>
<div class="legend">{{LEGEND}}</div>
<div class="scroll"><figure>
